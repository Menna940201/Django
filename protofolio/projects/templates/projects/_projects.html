{% extends 'base.html' %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% block home %}
        <title>Projects</title>
        <style>
            div{
                margin: auto;
                width: 70%;
            }
            table{
                border-collapse: separate ;
                border-spacing: 0 15px ;
            }
            td, th{
                padding: 10px 20px ;
            }
            .btn{
                background-color: #080d18;
                border-radius: 15px;
                /* font-size: 30px; */
                padding: 20px;
            }
            </style>
    </head>
    <body>
        <div>
            
            <table class="table table-borderless">
                <thead>
                <tr>
                    <th scope="project number">Id</th>
                    <th scope="title">title</th>
                    <th scope="description">description</th>
                    <th scope="show">show</th>
                </tr>
                </thead>
                {% for project in projects %}
                <tr>
                    <td>{{project.num}}</td>
                    <td>{{project.title}}</td>
                    <td>{{project.description}}</td>
                    <td><a href="{% url 'project' project.num %}" class="btn btn-info navbar">Show</a></td>
                </tr>
                {% endfor %}
                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
            </table>
    </div>
        {% endblock %}
    </body>
</html>
